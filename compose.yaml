services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: training_log
      POSTGRES_PASSWORD: training_log
      POSTGRES_DB: training_log
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_log -d training_log"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
